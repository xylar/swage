# PyPI project name -> conda-forge package name, where they differ.
#
# This is the global layer; a family or feedstock file can override any entry
# for its own scope. A hit here counts as an exact resolution rather than a
# guess -- these are facts about conda-forge's naming that somebody checked.
#
# Holds both of the tools swage replaces: every entry of their two name tables
# is here.
#
# An entry that maps a name to *itself* is not redundant and must not be
# tidied away. Identity is resolved by layer 5, below the grayskull mapping
# (layer 4), so a name grayskull renames can only be held at its own spelling
# by a layer above it -- which is this file. There are two such entries today
# and both are marked.

GitPython: gitpython
PyAthena: pyathena
PyGithub: pygithub
PyOpenSSL: pyopenssl
alibabacloud_adb20211201: alibabacloud-adb20211201
# conda-forge spells it with underscores, and upstream declares it both ways.
alibabacloud-credentials-api: alibabacloud_credentials_api
alibabacloud_tea_openapi: alibabacloud-tea-openapi
# Identity on purpose, to override grayskull. conda-forge publishes both
# `airflow` and `apache-airflow`, and grayskull's table maps the PyPI name to
# `airflow` -- which was very likely the name before Apache prefixed its
# projects, and is not the name the ~99 provider recipes depend on. PyPI's
# spelling is the one to keep, so this holds it against the rename.
apache-airflow: apache-airflow
asana: python-asana
confluent-kafka: python-confluent-kafka
# conda-forge's `dask` is a metapackage pulling in the distributed scheduler,
# the dataframe stack and the dashboard; the library PyPI's `dask` publishes is
# `dask-core`. A recipe that means the metapackage says so with a `dask: dask`
# entry of its own.
dask: dask-core
docker: docker-py
facebook-business: facebook_business
flask_limiter: flask-limiter
flit_core: flit-core
# conda-forge's `flatbuffers` is the C++ library; the python bindings are
# `python-flatbuffers`, which is what PyPI's `flatbuffers` publishes.
flatbuffers: python-flatbuffers
# conda-forge splits this feedstock: the library itself is the -core output.
google-cloud-bigquery: google-cloud-bigquery-core

# Dependencies carrying an extra. conda-forge sometimes packages the extra as a
# separate feedstock and sometimes folds it into the base package, so the key is
# the whole requirement rather than the bare name -- resolving
# `google-api-core[grpc]` to `google-api-core` would silently drop the grpc
# support the recipe is asking for.
"google-api-core[grpc]": google-api-core-grpc
# The same split one package over, and the entry `grpc-google-iam-v1` was
# missing: it declares `googleapis-common-protos[grpc]` and no plain form, so
# without this the extra is dropped and the recipe asks for the package without
# its gRPC bindings.
"googleapis-common-protos[grpc]": googleapis-common-protos-grpc
# conda-forge's google-auth already includes the pyopenssl extra.
"google-auth[pyopenssl]": google-auth
# conda-forge builds ray as one recipe with an output per extra, and
# `ray-default` is `ray-core` plus what upstream's `default` extra pulls in --
# the dashboard, the metrics exporters and the job submission client. The
# requirement and the output line up exactly.
"ray[default]": ray-default
# conda-forge builds uvicorn's `standard` extra as its own package.
"uvicorn[standard]": uvicorn-standard
# The same, one project over: `wetterdienst` publishes an output per extra,
# and its own `mcp` extra asks for `wetterdienst[restapi]`.
"wetterdienst[restapi]": wetterdienst-with-restapi
# `airflow-feedstock` and the provider feedstocks are the same shape again:
# each `-with-<extra>` output is the package for one upstream extra, and the
# `all-core` extra of `apache-airflow` is `apache-airflow-core[all]`, which is
# the whole of `apache-airflow-core-with-all`.
"apache-airflow-core[all]": apache-airflow-core-with-all
"apache-airflow-providers-amazon[aiobotocore]": apache-airflow-providers-amazon-with-aiobotocore
"apache-airflow-providers-amazon[s3fs]": apache-airflow-providers-amazon-with-s3fs
"apache-airflow-providers-common-sql[pandas]": apache-airflow-providers-common-sql-with-pandas
"apache-airflow-providers-common-sql[polars]": apache-airflow-providers-common-sql-with-polars
# conda-forge's `eccodes` is the C library; `python-eccodes` is the binding,
# which is what PyPI's `eccodes` publishes.
eccodes: python-eccodes
# conda-forge's `graphviz` is the C library; `python-graphviz` is the binding,
# which is what PyPI's `graphviz` publishes.
graphviz: python-graphviz
# conda-forge's `h3` is the C library and `h3-py` is the python binding.
h3: h3-py
hdfs: python-hdfs
jsonpath_ng: jsonpath-ng
# conda-forge publishes plotly's image export as `python-kaleido`.
kaleido: python-kaleido
kubernetes: python-kubernetes
matplotlib: matplotlib-base
msal-extensions: msal_extensions
msgpack: msgpack-python
neo4j: neo4j-python-driver
pgvector: pgvector-python
# Identity on purpose, to override grayskull. conda-forge's `psycopg2-binary`
# carries no code -- it is a `psycopg2_binary` dist-info pinned to `psycopg2`,
# published so that `pip check` passes for anything declaring the name. Nothing
# else answers to it, so resolving the name to `psycopg2` fails the check in
# every recipe that runs one.
psycopg2-binary: psycopg2-binary
qdrant_client: qdrant-client
redis: redis-py
# conda-forge publishes both spellings from one feedstock, and they are not
# equals: `setuptools-scm` is the package, with every dependency on it, and
# `setuptools_scm` is a `noarch: generic` metapackage whose only content is a
# pin back to it. Resolving to the alias works and is worse -- a recipe that
# says the alias depends on a shim for no reason. The same shape as the
# `apache-airflow` entry above: swage cannot tell which of two real packages
# is meant, so somebody looks once and writes it down.
setuptools_scm: setuptools-scm
slack-sdk: slack_sdk
# Nothing on conda-forge publishes PyPI's backport of the distutils that left
# the standard library in 3.12. conda-forge's `setuptools` carries the vendored
# copy and the `distutils-precedence.pth` that makes `import distutils` find
# it, so a build asking for the backport already has what it wants.
standard-distutils: setuptools
trino: trino-python-client
# conda-forge spells it with an underscore; upstream declares the hyphen.
vcs-versioning: vcs_versioning
