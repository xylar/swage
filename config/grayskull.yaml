# The feedstocks whose conda-forge.yml swage switches from
# `bot.inspection: update-grayskull` to `hint-grayskull`, on the next bot pull
# request it pushes to. A feedstock with a file of its own can say
# `grayskull: hint` there instead, never both.
#
# Under update-grayskull the bot rewrites the requirements swage reconciles.
# That is worth keeping wherever somebody might merge on green CI before swage
# has read the pull request, so a feedstock is named here only where nobody
# will.
#
# Batches, as in trust.yaml: the reason is the argument for everyone in it.

hint:
  - reason: >-
      One maintainer, who merges only after swage has run. Every one was on
      update-grayskull on 2026-09-29.
