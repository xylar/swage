never:
  - reason: >-
      Not being carried forward: there is no plan to update this feedstock, so
      swage writes nothing to it. It has four open bot pull requests, which is
      where conda-forge's bot stops filing new ones, and the `pyproject.toml`
      its recipe names has no `[project]` table for swage to reconcile
      against.
    feedstocks:
      - cime_gen_domain

  - reason: >-
      swage is not the right tool for this feedstock as it stands. The recipe
      is still on the old format, and the conversion swage produces is one it
      reads back as wrong: the converter cuts `--no-build-isolation` short and
      leaves a `${{` it never closes, so nothing swage plans here is about a
      recipe anybody would write. Upstream has not released since 1.10.1 in
      September 2024, nor committed since February 2025.
    feedstocks:
      - fiona

  - reason: >-
      Nothing on conda-forge depends on this package any more: the one that
      did is dropping the dependency. It is maintained by hand from here, so
      swage writes nothing to it. Upstream's last release is 1.1.0 from
      December 2023, and the repository activity since is housekeeping rather
      than a release.
    feedstocks:
      - datatable
