  # Two families, promoted by name rather than by their globs. What a glob
  # would also bless is every member added later, and a provider swage has
  # never read is not one these readings say anything about.
  - reason: >-
      Approval and nothing else was outstanding in five readings of the fleet
      over five days, for every one of these. Each is a single
      `noarch: python` output publishing no extras, reconciled against one
      `pyproject.toml` at one tag of one repository, and what swage would
      change is a line or two: twelve of the twenty with anything to push at
      all are a single line moved or re-bounded. The providers that are not
      this shape are absent -- `apache-airflow-providers-common-sql` builds
      four outputs from upstream extras, and `-amazon` and `-google` each
      have a question outstanding.
