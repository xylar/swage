# gdal builds 21 outputs against 48 native libraries, and its recipe is
# maintained by a team. It is more recipe than swage should be writing to.

feedstock: gdal

trust: never

# `libgdal-core` constrains `libgdal` to its own version, holding the split
# metapackage in lockstep. Nothing upstream is behind it.
run_constraints:
  libgdal:
    extra: null
