# A split feedstock: one sdist, two outputs.
#
# This is the `outputs[].run` model -- upstream extras get folded into an
# existing output's run section rather than becoming outputs of their own.

feedstock: google-cloud-bigquery
family: google-cloud

trust: propose

outputs:
  # The library itself, with upstream's own dependencies and nothing else.
  google-cloud-bigquery-core:
    run:
      core: true
  # The metapackage over every extra conda-forge ships. Extra names are
  # PEP 685-normalized: this sdist's pyproject.toml says `bigquery_v2` and its
  # PKG-INFO says `bigquery-v2`, so swage settles on the normalized spelling
  # and the config does not depend on which file it read.
  google-cloud-bigquery:
    run:
      core: false
      extras:
        - bqstorage
        - pandas
        - ipywidgets
        - geopandas
        - ipython
        - matplotlib
        - tqdm
        - opentelemetry
        - bigquery-v2
      # Declaring a skip list is what opts this feedstock into exhaustiveness
      # (G3): from here on, an upstream extra in neither list stops it.
      #
      # `all` is upstream's self-referential bundle -- it names the other nine
      # and nothing else (DESIGN.md 3.3.12), so today it is exactly what the
      # metapackage above ships. It is declined rather than folded in so the
      # list stays curated: when upstream adds a tenth extra, `all` grows and
      # this recipe does not, and G3 stops the feedstock so that publishing it
      # is a decision somebody makes rather than something that happens.
      skip:
        - all
