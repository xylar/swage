# Two dependencies carry extras conda-forge has no package for. fsspec's http
# extra pulls in aiohttp; polars keeps fastexcel in run_constraints, so the
# calamine extra has to be asked for by name.

feedstock: wetterdienst

embedded_extras:
  "fsspec[http]":
    - aiohttp !=4.0.0a0,!=4.0.0a1
  "polars[calamine]":
    - fastexcel >=0.9

# One output per upstream extra, named for it. `cratedb` and `radar` are
# skipped: conda-forge has no sqlalchemy-cratedb or tabula, and the recipe
# keeps their outputs commented out.
extras_as_outputs:
  suffix: "{name}-with-{extra}"
  supported:
    - bufr
    - duckdb
    - eccodes
    - excel
    - export
    - influxdb
    - interpolation
    - knmi
    - mcp
    - mysql
    - pdf
    - plotting
    - postgresql
    - radarplus
    - restapi
    - sql
  skip:
    - cratedb
    - radar

# `matplotlib` is an output of this recipe and not an upstream extra, so it
# draws on nothing upstream declares and carries one line of its own.
outputs:
  # Upstream's `export` extra is published twice: `-with-export` takes all of
  # it, above the python floor zarr 3.1 needs, and this output carries the
  # four that are available below it.
  wetterdienst-with-export-without-zarr:
    run:
      core: false
      from_extras:
        export:
          - pandas
          - sqlalchemy
          - xarray
          - xlsxwriter
  wetterdienst-with-matplotlib:
    run:
      core: false

add_requirements:
  outputs:
    wetterdienst-with-matplotlib:
      run:
        - line: matplotlib-base >=3.3,<4
          reason: >-
            the plotting backend this output exists to add. Upstream declares
            no matplotlib extra, so nothing in its metadata names it.

# `duckdb` is upstream's spelling of a package conda-forge publishes under
# another name, kept in the recipe from before swage resolved names. swage
# renders the conda-forge name, so the old line is an artifact it may drop.
retire:
  - duckdb

