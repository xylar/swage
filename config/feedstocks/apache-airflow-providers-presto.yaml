# Upstream declares `psycopg2-binary` among this provider's core dependencies,
# the same as the postgres provider, and conda-forge's package of that name is
# the dist-info shim `pip check` needs. The recipe keeps upstream's spelling
# rather than resolving to `psycopg2`, which installs no `psycopg2_binary`
# dist-info for pip to find.

feedstock: apache-airflow-providers-presto

name_map:
  psycopg2-binary: psycopg2-binary
