feedstock: zppy-interfaces

add_requirements:
  run:
    - line: mpas_tools >=0.21.0
      reason: >-
        an E3SM companion package published on conda-forge and not on PyPI, so
        upstream has no way to declare it.
    - line: output_viewer ==1.3.3
      reason: >-
        the viewer zppy-interfaces writes output for, published on conda-forge
        and not on PyPI.
