feedstock: pyremap

add_requirements:
  run:
    - line: nco >=4.8.1
      reason: >-
        pyremap drives the NCO command-line operators to apply mapping files.
        PyPI's `nco` is a set of python bindings rather than the tools
        themselves.
    - line: esmf
      reason: pyremap builds its mapping files with ESMF, which is not on PyPI.

# pyremap declares dask for xarray's chunking and imports it nowhere, so
# `dask-core` is what it asks for.
retire:
  - dask
