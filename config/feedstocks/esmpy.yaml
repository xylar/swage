feedstock: esmpy

add_requirements:
  host:
    - line: esmf ==${{ version }} nompi_*
      reason: >-
        esmpy wraps the ESMF library itself, which is not on PyPI. The build
        string keeps this output on the serial build.
    - line: make
      reason: >-
        the recipe runs ESMF's own test target, which needs GNU make. PyPI's
        `make` is an unrelated python package.
    - line: numpy
      reason: >-
        the build runs the test suite, under the recipe's own `for testing`
        heading. Upstream declares numpy as a run dependency, which the recipe
        states separately.
    - line: pytest
      reason: the build runs the test suite; upstream declares pytest under its testing extra.
    - line: pytest-json-report
      reason: >-
        the build runs the test suite and reports it as JSON. Upstream declares
        this under its testing extra.
    - line: scipy
      reason: >-
        the build's test suite regrids with scipy. Upstream declares it under
        its testing extra and the installed package does not need it.
  run:
    - line: esmf ==${{ version }}
      reason: esmpy loads the ESMF library at runtime, and it is not on PyPI.
