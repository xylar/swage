# The `setuptools` line in `run` is stated per python version rather than
# plainly, so dropping it takes a recipe edit rather than a `retire` entry.

feedstock: dulwich

add_requirements:
  host:
    - line: setuptools-rust
      reason: >-
        the rust extension is built with it. Upstream installs it from its
        cibuildwheel before-build hook rather than declaring it in
        build-system requires.
