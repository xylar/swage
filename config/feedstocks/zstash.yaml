feedstock: zstash

# zstash is installed with conda and released as a GitHub tag rather than to
# PyPI, so its archive carries no built metadata and its pyproject.toml
# declares no dependencies.
upstream:
  source: manual
  declares:
    - conda/dev.yml
    - pyproject.toml
  reason: >-
    what a zstash environment needs is listed in conda/dev.yml under `# Base`,
    at the bounds the recipe carries; pyproject.toml states requires-python
    and no dependencies at all.
