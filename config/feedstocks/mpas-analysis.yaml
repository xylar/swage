feedstock: mpas-analysis

add_requirements:
  run:
    - line: cartopy_offlinedata
      reason: cartopy's offline map data, published on conda-forge and not on PyPI.
    - line: esmf >=8.4.2,<9.0.0
      reason: the ESMF library the regridding runs on, which is not on PyPI.
    - line: geometric_features >=1.6.1
      reason: an E3SM companion package published on conda-forge and not on PyPI.
    - line: mache >=1.11.0
      reason: an E3SM companion package published on conda-forge and not on PyPI.
    - line: mpas_tools >=1.3.0,<2.0.0
      reason: an E3SM companion package published on conda-forge and not on PyPI.
    - line: nco >=4.8.1,!=5.2.6,!=5.3.7
      reason: >-
        the NCO command-line operators this analysis drives. PyPI's `nco` is a
        set of python bindings rather than the tools themselves.
    - line: pyremap >=2.0.0,<3.0.0
      reason: an E3SM companion package published on conda-forge and not on PyPI.
    - line: f90nml
      reason: >-
        mpas-analysis reads MPAS namelists with f90nml. Upstream's metadata
        omits it, so the recipe has always carried it.

# Upstream declares setuptools to build with, and this package does not import
# it at runtime -- so the `run` line is an artifact and swage may drop it. The
# `host` line upstream accounts for and this never touches.
#
# mpas-analysis runs its climatologies on a thread pool set through
# `dask.config`, which is `dask-core`; nothing here uses the metapackage.
retire:
  - setuptools
  - dask
