# setuptools-scm has made TOML support unconditional since version 8, so the
# `toml` extra pulls in nothing conda-forge's package is missing.

feedstock: pdbufr

embedded_extras:
  "setuptools-scm[toml]": []

# `pytest-runner` appears nowhere in the release -- not in build-system
# requires, not in setup.cfg, not as a setup_requires. It ran tests through
# `setup.py test`, which the recipe does not use and setuptools has removed.
retire:
  - pytest-runner
