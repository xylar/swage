# Each run constraint states the bound the extra it tracks declares; upstream's
# `doh` extra accounts for three of them.

feedstock: dnspython

run_constraints:
  aioquic:
    extra: doq
  cryptography:
    extra: dnssec
  h2:
    extra: doh
  httpcore:
    extra: doh
  httpx:
    extra: doh
  idna:
    extra: idna
  trio:
    extra: trio
  wmi:
    extra: wmi

# `sniffio` is left over from the curio backend upstream has since dropped.
# The only backend sniffing still selects is trio, which requires sniffio
# itself, so the line adds nothing to what trio already brings.
retire:
  - sniffio
