feedstock: timezonefinder

# Upstream states no ceiling on numpy. `h3-py >4` is left to reconcile: it
# refuses 4.0 itself, which upstream's `>=4` asks for, so it reads as a typo
# rather than a decision.
temporary_constraints:
  numpy:
    bound: "<3"
    reason: >-
      the recipe holds numpy below its next major release, which upstream does
      not ask for. Re-check when numpy 3 lands and this package has been tried
      against it.
