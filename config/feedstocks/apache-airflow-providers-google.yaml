feedstock: apache-airflow-providers-google
family: airflow-providers

# 22.4.0 asks for `google-cloud-aiplatform[evaluation]` again, after 22.3.0
# had dropped the extra and listed its dependencies directly. conda-forge's
# google-cloud-aiplatform lists `evaluation` under `skip`, so there is no
# package to depend on and the extra's contents belong here.
#
# Taken from google-cloud-aiplatform 1.165.1, which is what conda-forge
# publishes; 1.164.0, the floor upstream states, declares the same six.
# `pandas` is the seventh and is left out: the provider declares it directly
# at `>=2.1.2` and up, far tighter than the `>=1.0.0` the extra asks for.
#
# `scikit-learn` is capped `<1.6.0` on python 3.10 and unconstrained above it,
# so with python_min at 3.11 there is no cap left to carry.
#
# `litellm` is the one line here that does not follow upstream. Upstream asks
# for `>=1.83.7,<1.86.0` below python 3.14 and `>=1.93.0,<1.97.0` from 3.14
# up, and on conda-forge neither can be installed at all: every litellm build
# from 1.83.4 to 1.98.0 build 0 constrains `google-cloud-kms` to `==2.24.2`
# or `>=2.24.2,<3.0`, and conda-forge's google-cloud-kms went 2.24.1 straight
# to 3.0.0. Nothing satisfies that window. litellm 1.98.0 build 1 is a
# rebuild with the constraint dropped, and it is the only one this recipe can
# take -- it is also the newest, so it carries the fixes upstream raised the
# aiplatform floor to reach, citing CVE-2026-35030 and the advisories
# following it. Re-check at the next version bump: once litellm rebuilds the
# releases in upstream's range without that constraint, this line should go
# back to stating what upstream states.
#
# 1.98.0 is built for python 3.11 and up, which is what the recipe's
# python_min of 3.11 is for.
embedded_extras:
  "google-cloud-aiplatform[evaluation]":
    - tqdm >=4.23.0
    - scikit-learn
    - jsonschema
    - ruamel.yaml
    - pyyaml
    - litellm >=1.98.0

# Upstream declared `PyOpenSSL>=23.0.0` through 19.1.0, the version this
# recipe still reflects, and dropped it in 21.0.0. Nothing in 22.4.0 accounts
# for the line.
retire:
  - pyopenssl
