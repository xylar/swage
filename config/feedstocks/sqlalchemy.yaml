feedstock: sqlalchemy

# Eighteen of upstream's twenty-six extras are published as a metapackage
# apiece, named `sqlalchemy-with-<extra>`. Declaring the lists is what opts the
# feedstock into accounting for all of them: an extra upstream adds later that
# appears in neither list holds the feedstock until somebody decides which it
# belongs in.
extras_as_outputs:
  suffix: "{name}-with-{extra}"
  supported:
    - asyncio
    - mssql
    - mssql-pymssql
    - mssql-pyodbc
    - mysql
    - mysql-connector
    - mariadb-connector
    - oracle
    - oracle-oracledb
    - postgresql
    - postgresql-pg8000
    - postgresql-asyncpg
    - postgresql-psycopg2binary
    - postgresql-psycopg
    - postgresql-psycopgbinary
    - pymysql
    - aiomysql
    - aiosqlite
  # Five of these name a driver conda-forge does not package at all, so there
  # is nothing for a metapackage to depend on: `psycopg2cffi`, `aioodbc`,
  # `asyncmy`, `sqlcipher3_binary` and `mssql-python`. `cymysql` and
  # `cx_oracle` are packaged but have no metapackage; `cx_oracle` is the
  # predecessor of `oracledb`, which upstream's `oracle` extra now uses.
  # `mypy` pulls in a type checker, a development tool rather than a database
  # driver.
  skip:
    - mypy
    - postgresql-psycopg2cffi
    - aioodbc
    - asyncmy
    - sqlcipher
    - mssql-python
    - oracle-cxoracle
    - cymysql

# conda-forge's `psycopg` already depends on `psycopg-c`, so the C speedups
# upstream's `binary` extra asks for are installed either way and the extra
# adds nothing here. An empty list records that; leaving the key out would say
# nobody had looked.
embedded_extras:
  "psycopg[binary]": []
