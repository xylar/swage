feedstock: ncvis-climate

# ncvis is a C++ program, not a python distribution, and its tarball carries no
# python metadata. What it declares is in the two `find_package` calls of its
# top-level `CMakeLists.txt`.
upstream:
  source: cmake

add_requirements:
  host:
    - line: xorg-libxxf86vm
      reason: >-
        wxWidgets' GL build links libXxf86vm, and conda-forge's wxwidgets
        carries xorg-libxxf86vm in host only -- neither a run dependency nor a
        run export -- so a build linking against it has to name it.
