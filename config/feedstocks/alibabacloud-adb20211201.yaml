# The feedstock chosen for swage's first real push.
#
# Every check that applies to it passes. The only one it fails is that nobody
# had approved it for automatic merging, which is the default talking rather
# than anything about this recipe. Three do not apply at all: it publishes no
# extras, it has one output, and swage does change its recipe, so the question
# of merging an unchanged one never arises.
#
# What makes it the right first target is blast radius rather than
# correctness. It has a single maintainer, so a mistake inconveniences nobody
# else; it builds one output; and what swage would change is two lines,
# reordering `darabonba-core` after `alibabacloud-tea-openapi` to match the
# order upstream declares them in. There is no version to get wrong and no
# constraint to lose.
#
# `propose` rather than `auto`, which is the middle rung of the ladder: push,
# never label. swage will commit to the bot's pull request and comment saying
# it did not ask for the pull request to be merged automatically, and a human
# decides whether it merges. Promotion to `auto` is evidence-backed and this
# is the run that produces the evidence, so it cannot also be the run that
# assumes it.
#
# Its dependencies are read from the wheel: the 4.1.0 sdist declares none,
# which the scan reports as a note.

feedstock: alibabacloud-adb20211201

trust: propose
