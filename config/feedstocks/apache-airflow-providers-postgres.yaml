# conda-forge's `psycopg2-binary` holds nothing but a `psycopg2_binary`
# dist-info pinned to `psycopg2`, and exists so that `pip check` passes for
# packages that depend on the name. Upstream declares it among this provider's
# core dependencies and the recipe's tests run `pip check`, so the line stays
# under upstream's spelling: resolving it to `psycopg2` leaves nothing
# installed under the name pip goes looking for.

feedstock: apache-airflow-providers-postgres

name_map:
  psycopg2-binary: psycopg2-binary
