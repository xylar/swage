# conda-forge's `psycopg2` is already the compiled build the `binary` wheel
# exists to deliver on PyPI, so upstream's `psycopg2-binary` resolves to it and
# the recipe's line under upstream's spelling is a second copy of the same
# package. conda-forge does publish `psycopg2-binary`, stalled at 2.9.10 while
# `psycopg2` moved on.

feedstock: apache-airflow-providers-postgres

retire:
  - psycopg2-binary
