# A single-output feedstock that folds upstream's one extra into its run
# section.
#
# `grpc` is reconstructed from the published recipe rather than decided here:
# the recipe carries `# from the grpc extra` above the two lines it contributes,
# which is the previous tool recording the same fact.
#
# No `skip` list, so this feedstock has not opted into exhaustiveness (G3) and
# upstream declares no other extra to decline. Adding one is a decision for the
# maintainer, not something reconstructable from the recipe.

feedstock: google-cloud-core
family: google-cloud

outputs:
  google-cloud-core:
    run:
      core: true
      extras:
        - grpc
