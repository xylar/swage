feedstock: e3sm_diags

add_requirements:
  run:
    - line: cartopy_offlinedata
      reason: >-
        cartopy's offline map data, which upstream's pyproject.toml carries
        commented out because it is not on PyPI.
    - line: esmf >=8.8.0 nompi_*
      reason: >-
        xesmf regrids with ESMF itself, which is not on PyPI. The build string
        keeps this recipe on the serial build.

# e3sm_diags maps over `dask.bag` with the process scheduler, which is
# `dask-core`; the metapackage's scheduler and dashboard go unused.
retire:
  - dask

# The recipe floors one of xcdat's own dependencies so `pip check` passes.
# Recorded rather than blessed, so swage asks again at every version bump.
temporary_requirements:
  run:
    - line: regionmask >=0.6.2
      reason: >-
        xcdat needs a newer regionmask than its metadata asks for. Drop this
        once xcdat states the floor itself.
