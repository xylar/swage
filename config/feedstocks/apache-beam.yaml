# A split feedstock: one sdist, twelve outputs.
#
# `apache-beam` is compiled -- it cythonizes the SDK -- and takes upstream's
# core dependencies. The eleven `-with-<extra>` outputs are noarch
# metapackages that pin it and add one upstream extra apiece, so each names
# that extra and draws nothing from core.
#
# `core: false` also keeps upstream's build backend out of them: they build
# from no source, and apache-beam pins grpcio-tools per python version in a
# way one noarch package cannot state.

feedstock: apache-beam

outputs:
  apache-beam-with-dill:
    run:
      core: false
      extras:
        - dill
  apache-beam-with-gcp:
    run:
      core: false
      extras:
        - gcp
  apache-beam-with-aws:
    run:
      core: false
      extras:
        - aws
  apache-beam-with-azure:
    run:
      core: false
      extras:
        - azure
  apache-beam-with-dataframe:
    run:
      core: false
      extras:
        - dataframe
  apache-beam-with-dask:
    run:
      core: false
      extras:
        - dask
  apache-beam-with-yaml:
    run:
      core: false
      extras:
        - yaml
  apache-beam-with-torch:
    run:
      core: false
      extras:
        - torch
  apache-beam-with-tensorflow:
    run:
      core: false
      extras:
        - tensorflow
  apache-beam-with-transformers:
    run:
      core: false
      extras:
        - transformers
  apache-beam-with-tensorflow-hub:
    run:
      core: false
      extras:
        - tensorflow-hub

# `apache-beam-with-gcp` is one noarch package installed on every python from
# 3.10 up, and upstream asks it for two versions of google-apitools that no
# single version can satisfy: `>=0.5.31,<0.5.32` below python 3.13 and
# `>=0.5.35` from 3.13. It states the later bound.
overruled_constraints:
  google-apitools:
    bound: ">=0.5.35"
    reason: >-
      upstream's cap below python 3.13 is there to keep its own ML test suites
      working against older Beam releases, not because 0.5.35 is unsafe on
      those pythons (apache/beam#35004); 0.5.35 declares the same
      requires-python and the same dependencies as 0.5.31, and the releases
      between them are python 3.11, 3.12 and 3.13 compatibility fixes
