# The feedstock that proves the merge, in three runs. The first is done.
#
# `auto` is the top of the ladder, and on this feedstock it means one specific
# thing: swage merges the bot's pull request itself. Nothing is left for it to
# push -- its commit is already there and CI passed on it -- so there is no
# label to add and nobody else will ever merge it. conda-forge's own automerge
# stopped being possible for this pull request the moment swage committed to
# it, because not every commit on it is a bot's any more.
#
# It sat at `propose` for the first run, which is the one that changed
# anything, and was promoted only after that change was on the pull request
# with green CI beside it and a maintainer had read it. What follows records
# what that run did, and is the reason promoting is defensible.
#
# **The python test matrix.** The recipe tested only `${{ python_min }}.*`,
# and a `noarch: python` package installs on every python from the minimum up,
# so the newest went untested. swage added `"*"` -- the first time it edited
# anything outside a requirements block on a real feedstock -- and
# `test_matrix: review` held that edit for a human, which is what put this
# feedstock in NEEDS REVIEW rather than PROPOSED. The linter and the build
# both passed on the result.
#
# **The comment wording.** Seven requirements carried a note in a spelling
# neither replaced tool wrote and swage did not, until recently, recognize.
# It does now, so each was replaced rather than joined by a second note saying
# the same thing; one became `# tightest of upstream's floors (python >=3.13)
# and ceilings (python >=3.10)`, which is what the hand-written note there
# already said in its own words.
#
# Nothing else changes. Every requirement is accounted for, every name
# resolves exactly, no dependency is added, removed or re-constrained, and no
# bound is dropped. Upstream declares one extra, `tests`, that no output draws
# on; this feedstock publishes no extras at all, so that is reported and
# nothing more.
#
# Blast radius is the argument that chose every live target so far: one
# maintainer, one output, and a change a reader can check in its entirety in
# under a minute.

feedstock: google-ads

trust: auto
