# Upstream computes its dependency list while building the sdist rather than
# declaring it, so the metadata says another build could produce a different
# one. The wheel published from the same release is that other build, and it
# lists the same 37 requirements.

feedstock: google-auth

dynamic_dependencies: trust

# The recipe folds in all three of upstream's extras: aiohttp brings aiohttp
# and requests, reauth brings pyu2f, and rsa brings rsa. Every line they bring
# is already in it.
outputs:
  google-auth:
    run:
      core: true
      extras:
        - aiohttp
        - reauth
        - rsa
