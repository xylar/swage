# The fleet's one feedstock that passes every check it is asked.
#
# The only thing swage holds it for is that nobody has approved it for
# automatic merging, which is the default talking rather than anything about
# this recipe: every requirement is accounted for, every name resolves, and
# nothing is being removed. There is nothing here for a human to reconcile.
#
# `propose` rather than `auto`: the middle rung says push, never label. It
# records that this feedstock is the first candidate without granting
# automatic merging to a write path that had not run yet -- promotion is
# evidence-backed, and the evidence comes from having pushed.

feedstock: grpcio-status

trust: propose
