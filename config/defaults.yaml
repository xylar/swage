# Global policy for every feedstock swage touches.
#
# Nothing here is a quirk -- this is the floor that family and feedstock files
# override.

# What swage does with a change every check below accounted for: push it to the
# bot's pull request, comment, and leave the labeling to a person.
#
# Whether swage pushes at all is the checks' answer rather than this line's. A
# change something could not account for is never offered, on any feedstock, at
# any rung -- so this says what happens with the ones that are understood, and
# there is nothing to write per feedstock to reach it.
#
# `auto` labels those for automatic merging as well, and belongs here too once
# there is enough evidence for it. `never`, in a feedstock's own file, is the
# other direction: swage writes nothing there at all.
trust: propose

# Requirement lines that are conda-forge structure rather than upstream
# metadata, preserved verbatim and never name-resolved.
#
# This is an allowlist, never a fallback. A template swage does not recognize
# is still preserved unchanged, but swage cannot say where it came from, so it
# holds the feedstock for review and quotes the line. Blessing a new one is a
# commit to this file.
#
# `functions` match the *name* position only: `${{ pin_subpackage(...) }}` is
# structure, while `pandas >=${{ x }}` is an ordinary dependency whose
# constraint happens to be templated.
recipe_owned:
  functions:
    - pin_subpackage
    - pin_compatible
    - compiler
    - stdlib
  names:
    - python
    - pip
    # The virtual packages that say which platform's artifact a `noarch:
    # python` package built through `noarch_platforms` is. Nothing upstream
    # declares one and nothing ever will, so asking a maintainer to account for
    # them asks about a decision that was never theirs.
    #
    # `__glibc`, `__cuda` and the rest are deliberately absent: those are
    # constraints somebody chose, and they should be explained like any other.
    - __linux
    - __osx
    - __win
    - __unix
  # Context variables a recipe names a whole dependency with. conda-forge's
  # global pinning builds the mpi feedstocks once per implementation, and
  # `${{ mpi }}` is the only way a recipe can say "whichever one this variant
  # is": the package is `mpich`, `openmpi` or `nompi` and which it is is not
  # known until conda-build picks a value. Nothing upstream declares it under
  # that name and nothing ever will.
  variables:
    - mpi

# What `host` is built with when upstream declares no build system at all.
#
# PEP 517 makes setuptools the implicit backend for a project with no
# `[build-system]` table, and conda-forge follows it -- the recipe still needs
# something in `host` to build with. This is strictly a backup for silence: a
# project that names hatchling or poetry-core gets what it asked for, and
# swage never overrides a maintainer here.
#
# Not hypothetical. 21 of the fleet's noarch sdists ship `setup.py` and
# `setup.cfg` with no `pyproject.toml` at all, and every one of those recipes
# already lists exactly `setuptools` in host -- so this states what the fleet
# has already decided rather than imposing anything on it.
default_build_requires:
  - setuptools

# Build requirements a cross build takes from the host prefix, so a recipe
# never repeats them in the `build` section.
#
# A cross-compiled recipe repeats some of `host` inside its
# `build_platform != target_platform` block, because a tool the build has to
# *run* has to exist for the build platform. Which ones is a judgment per
# dependency and swage does not make it -- what this list settles is the other
# half, the requirements for which the question does not arise. These are pure
# python, imported by a backend already running under `cross-python_*`, and a
# change to one cannot leave a cross block stale because no cross block
# repeats it.
#
# The fleet agrees, near enough to be worth stating: `setuptools` appears in
# the `host` section of 15 of the 19 outputs with a cross block, and exactly
# one repeats it in `build`. Nothing else here is repeated by any of them,
# while `cython` is repeated by all 6 outputs that have it and `numpy` by 3 of
# 4 -- so what belongs on this list and what does not are two visibly
# different populations rather than a line drawn through one.
#
# An allowlist, never a fallback. A name missing from it holds the feedstock
# for review, which is a stop rather than a recipe that builds natively and
# fails cross-compiled. Adding one is a commit to this file, and the question
# to answer first is whether a build would ever execute it.
#
# Every name here is one a cross-compiled output in the fleet states in `host`
# today. `hatchling`, `flit-core` and the other backends of that kind are
# absent for that reason and not because they would be wrong: the first
# cross-compiled feedstock to want one will be held until somebody adds it,
# which is the behavior rather than a gap in it.
pure_python_build_tools:
  - packaging
  - poetry-core
  - setuptools
  - setuptools-git
  - setuptools-git-versioning
  - setuptools-scm
  - toml
  - tomli
  - wheel

# An upstream-dropped removal is a proving period, not a permanent rule.
# `review` holds the pull request for a human; `auto` treats it as an ordinary
# change. Promote deliberately, once there is a body
# of removals swage classified correctly.
removals: review

# Whether a dependency list upstream computed at build time rather than
# declaring may merge unattended. A computed list is complete but not
# guaranteed to be the same next build, so `review` holds it for a human;
# `trust` is the escape hatch if that turns out to cost more than it saves.
dynamic_dependencies: review

# Whether a recipe whose python test matrix swage completed may merge
# unattended. conda-forge asks that a noarch: python package be tested on the
# latest Python as well as the minimum, and swage makes that change while it
# is already updating a recipe -- never in a pull request of its own.
#
# Promoted from `review`. The completion is one line, it is what conda-forge
# asks for, and holding it was the single largest thing standing between this
# fleet and unattended maintenance: 91 feedstocks, 47 of them held by nothing
# else. What swage writes here has been read on the feedstocks it has already
# updated.
#
# This is the first thing swage writes outside a requirements block, so it
# stays a `review`-able decision per feedstock: a family or feedstock file can
# set `test_matrix: review` to put its own recipes back in front of a human.
test_matrix: auto
