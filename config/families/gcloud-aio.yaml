# The seven gcloud-aio-* feedstocks: asyncio clients for Google Cloud
# services, published to PyPI as separate packages out of one repository.
#
# No quirks. Each recipe names its own sdist and reconciles against it, so what
# this file carries is the name: it is what `--family gcloud-aio` selects, and
# what makes the seven one thing to ask about.

family: gcloud-aio
match:
  feedstock: "gcloud-aio-*"

# Nothing else to say. A feedstock earns `trust: auto` in its own file, once a
# cycle has been watched end to end, and no family may confer it.
