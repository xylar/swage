# The ~50 google-cloud-* feedstocks.
#
# Upstream metadata comes from the sdist on PyPI. Ported whole from
# google-cloud/update_google_cloud_recipes.py: its name map is in
# config/name-map.yaml, and the five feedstocks whose outputs draw on an
# upstream extra have their own files.

family: google-cloud
match:
  feedstock: "google-cloud-*"

upstream:
  source: archive

# These projects compute their dependency list while building the sdist rather
# than declaring it, so the metadata says another build could produce a
# different one. Checked against the wheel published from the same release,
# which is that other build: 48 of the 49 match exactly, 393 requirement
# strings in all. The one that differs is google-cloud-aiplatform, and only in
# the order of six extras it does not publish.
dynamic_dependencies: trust

# The grayskull workaround, retired. grayskull drops the extra
# from `google-api-core[grpc]`, so recipes maintained beside it were written to
# survive being regenerated: a constrained plain `google-api-core`, which is
# what grayskull would produce anyway, next to a bare `google-api-core-grpc`
# carrying the dependency that actually matters. swage resolves the requirement
# properly, which makes the plain line dead in every recipe whose upstream
# declares only the extra -- 38 of the 50 feedstocks in this family, each with
# that one line as the only thing swage cannot account for.
#
# Listing it here is safe by construction rather than by care. A name is only
# ever consulted once upstream has been asked and had nothing to say about it,
# in any version and under any extra, so `google-cloud-storage` -- which
# declares plain `google-api-core` itself, beside `google-api-core[grpc]` in an
# extra -- never reaches this list at all. The entry cannot remove a dependency
# upstream wants; it can only remove a line upstream has never heard of.
retire:
  - google-api-core
