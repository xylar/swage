# The ~99 apache-airflow-providers-* feedstocks.
#
# Upstream is the airflow monorepo rather than PyPI: each provider release is a
# git tag carrying that provider's pyproject.toml. Ported from
# airflow-feedstock/providers/update_providers.py; the full quirk set follows in
# phase 7.

family: airflow-providers
match:
  feedstock: "apache-airflow-providers-*"

upstream:
  source: github
  repo: apache/airflow
  # e.g. providers-apache-hive/9.6.1
  tag: "providers-{slug}/{version}"
  # e.g. providers/apache/hive/pyproject.toml
  metadata: "providers/{slug_path}/pyproject.toml"

# Not blessed as a family: individual providers earn `trust: auto` one at a
# time, in their own file.
trust: propose

requires_python:
  min: "3.10"

# Only a handful of providers publish extras as outputs, and which extras they
# publish differs per provider -- so `supported`/`skip` live in the feedstock
# files, which repeat this suffix. The suffix itself is a family convention.
extras_as_outputs:
  suffix: "{name}-with-{extra}"

embedded_extras:
  # An upstream requirement that itself carries an extra; conda-forge has no
  # equivalent, so the extra's dependencies are spliced in behind a marker
  # comment (DESIGN.md 6). An empty list means "declared, adds nothing" --
  # materially different from the key being absent.
  #
  # Extra names are PEP 685-normalized, which is why this reads
  # `hive-pure-sasl` where upstream's pyproject.toml writes `hive_pure_sasl`:
  # the two metadata sources spell it differently and swage settles on one.
  "aiobotocore[boto3]": []

  # conda-forge's `psycopg` already depends on `psycopg-c` (a
  # `pin_subpackage` in the psycopg2 feedstock, which builds both), so the
  # compiled implementation upstream's `binary` extra exists to deliver is
  # what the base package already installs. PyPI needs the extra because
  # `psycopg` alone is pure Python there and `psycopg-binary` ships the
  # prebuilt wheels; conda-forge has no such package and needs none.
  "psycopg[binary]": []
  # `celery[redis]` is `kombu[redis]`, which is
  # `redis !=4.5.5,!=5.0.2,<6.5,>=4.5.2` -- conda-forge's `redis-py`.
  #
  # **This one adds a dependency the recipe is missing.** conda-forge's
  # `celery` does not depend on `redis-py`, and neither did this provider, so
  # the conda package has shipped without the redis support upstream declares
  # and `pip install apache-airflow-providers-celery` provides. The
  # maintainer confirms that is an oversight rather than a decision.
  #
  # The constraint is kombu's and is maintained by hand here, so it can go
  # stale as kombu moves; swage will not re-derive it (DESIGN.md 3.2).
  "celery[redis]":
    - redis-py >=4.5.2,<6.5,!=4.5.5,!=5.0.2

  "pandas[sql-other]":
    - sqlalchemy >=2.0.36
    - adbc-driver-postgresql >=1.2.0
    - adbc-driver-sqlite >=1.2.0
  # papermill's `all` extra, which the provider asks for wholesale. Nine
  # packages and conda-forge has every one, so there is nothing to decline on
  # availability grounds -- the maintainer's call is that an Airflow provider
  # asking for papermill's cloud backends should get them.
  #
  # Ordered as the published recipe already had them, so the only diff swage
  # produces on that feedstock is the constraints, which come from papermill
  # 2.7.0 and were looser or absent in the hand-written block: the upper bound
  # on azure-datalake-store had been dropped entirely.
  "papermill[all]":
    - azure-datalake-store >=0.0.30,<1.0.0a0
    - azure-storage-blob >=12.1
    - requests >=2.21
    - azure-identity >=1.3.1
    - gcsfs >=0.2
    - pygithub >=1.55
    - pyarrow >=2
    - boto3
    - black >=19.3b0

  # scrapbook's `all` extra is a single entry, `papermill` -- which this
  # provider already depends on directly. So the extra really does add nothing
  # here, though for a different reason from psycopg's: not "conda-forge needs
  # no such package" but "the package it names is already in the recipe".
  "scrapbook[all]": []


  # `hdfs[avro,dataframe,kerberos]` is `fastavro >=0.21.19`,
  # `pandas >=0.14.1` and `requests-kerberos >=0.7.0`. Only the last is
  # written here, and the omission is deliberate: the provider declares
  # `fastavro` and `pandas` itself, at constraints far tighter than hdfs asks
  # (`>=1.12.1` and `>=2.3.3` on python 3.14). Listing them again would at
  # best duplicate a line swage already renders and at worst loosen it.
  #
  # hdfs publishes no wheel and its sdist carries no `Requires-Dist` at all,
  # so this came from reading `setup.py`'s `extras_require` by hand. Nothing
  # about it is machine-checkable, which is the argument for the comment.
  "hdfs[avro,dataframe,kerberos]":
    - requests-kerberos >=0.7.0

  "pyhive[hive-pure-sasl]":
    - pure-sasl >=0.6.2
    - thrift >=0.10.0
    - thrift_sasl >=0.1.0
