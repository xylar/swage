[workspace]
name = "swage"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11"
packaging = ">=23.0"
pydantic = ">=2.7"
pyyaml = ">=6.0"
"ruamel.yaml" = ">=0.18"

# Every runtime dependency is a conda package; swage itself is the one thing
# that is not, and it is installed editable so that `import swage` and the
# `swage` console script both work anywhere in the environment. A fresh
# worktree otherwise has neither: pytest reaches src/ through `pythonpath`, so
# the tests pass while `pixi run python -c "import swage"` does not.
#
# This is `feature.editable` rather than `feature.dev` so CI can leave it out
# (the `ci` environment below). CI runs pytest and nothing else, so it never
# needs the console script, and the editable install is pure cost there.
#
# The cost is smaller than it once was: pixi fetches prefix.dev's conda-to-PyPI
# mapping as per-package shards on demand rather than as one ~500 MB index, so
# a cold `pixi install` here is about six seconds.
[feature.editable.pypi-dependencies]
swage = { path = ".", editable = true }

[feature.dev.dependencies]
hatchling = "*"
mypy = "*"
pip = "*"
pytest = "*"
pytest-cov = "*"
ruff = "*"
types-pyyaml = "*"

[feature.docs.dependencies]
mkdocs = "*"
mkdocs-material = "*"

# Phase 1 round-trip spike (spikes/crm_roundtrip.py). conda-recipe-manager is
# not a swage dependency -- the spike is what decided that it should not be.
[feature.spike.dependencies]
conda-recipe-manager = ">=0.10.5"

[environments]
# The development environment *is* the default one, so `pixi shell` and a bare
# `pixi run` give you the tooling and the `swage` console script with no flag
# to remember. Naming it `dev` as well would be a second environment with
# identical contents, which pixi solves and locks separately for nothing.
default = ["dev", "editable"]
# What CI runs: the same tooling, without the editable install it has no use
# for. Keeping the difference to that one package is deliberate -- a CI
# environment that diverges further stops testing what developers run.
ci = ["dev"]
docs = ["docs"]
spike = ["dev", "spike"]

[feature.dev.tasks]
lint = "ruff check src tests"
fmt-check = "ruff format --check src tests"
fmt = "ruff format src tests"
typecheck = "mypy"
test = "pytest"
cov = "pytest --cov=swage --cov-report=term-missing"
check = { depends-on = ["lint", "fmt-check", "typecheck", "test"] }

[feature.docs.tasks]
docs-build = "mkdocs build --strict"
docs-serve = "mkdocs serve"

[feature.spike.tasks]
spike-crm = "python spikes/crm_roundtrip.py"
