[workspace]
name = "swage"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11"
pydantic = ">=2.7"
pyyaml = ">=6.0"

# Deliberately all-conda: swage is not installed into the environment as a PyPI
# dependency. Doing so would drag in prefix.dev's conda-to-PyPI mapping index (a
# ~500 MB download) for no benefit, since every dependency is a conda package
# and pytest imports swage straight from src/ via `pythonpath`.

[feature.dev.dependencies]
hatchling = "*"
mypy = "*"
pip = "*"
pytest = "*"
pytest-cov = "*"
ruff = "*"
types-pyyaml = "*"

[feature.docs.dependencies]
mkdocs = "*"
mkdocs-material = "*"

[environments]
dev = ["dev"]
docs = ["docs"]

[feature.dev.tasks]
# Only needed to get the `swage` console script onto PATH; the tests do not
# require it.
dev-install = "python -m pip install -e . --no-deps --no-build-isolation"
lint = "ruff check src tests"
fmt-check = "ruff format --check src tests"
fmt = "ruff format src tests"
typecheck = "mypy"
test = "pytest"
cov = "pytest --cov=swage --cov-report=term-missing"
check = { depends-on = ["lint", "fmt-check", "typecheck", "test"] }

[feature.docs.tasks]
docs-build = "mkdocs build --strict"
docs-serve = "mkdocs serve"
