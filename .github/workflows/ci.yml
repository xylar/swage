name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          environments: ci
          cache: true

      - name: Lint
        run: pixi run -e ci lint

      - name: Format
        run: pixi run -e ci fmt-check

      - name: Type check
        run: pixi run -e ci typecheck

      - name: Test
        run: pixi run -e ci cov

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          environments: docs
          cache: true

      - name: Build docs
        run: pixi run -e docs docs-build

      # Uploaded on every run, not only on main, so a pull request that breaks
      # the site fails here rather than after it has merged.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # The site is published from the artifact the job above built, so what is
  # served is what CI checked rather than a second build of its own.
  deploy-docs:
    name: deploy docs
    if: github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
