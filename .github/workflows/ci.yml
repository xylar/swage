name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          environments: dev
          cache: true

      - name: Lint
        run: pixi run -e dev lint

      - name: Format
        run: pixi run -e dev fmt-check

      - name: Type check
        run: pixi run -e dev typecheck

      - name: Test
        run: pixi run -e dev cov
