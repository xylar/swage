schema_version: 1

context:
  name: google-cloud-bigquery
  version: "3.43.0"

recipe:
  name: ${{ name|lower }}-split
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name|replace('-', '_') }}-${{ version }}.tar.gz
  sha256: e3dc25ab9ac8b2b089408493177d4d4508b098c80c3931786fbc20b075298fe6

build:
  number: 0

outputs:
  - package:
      name: ${{ name }}
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
        - pip
        - setuptools
      run:
        - ${{ pin_subpackage('google-cloud-bigquery-core', exact=True) }}
        - python >=${{ python_min }}
        # from the bqstorage extra
        - google-cloud-bigquery-storage >=2.29.0,<3.0.0
        # more restrictive constraint for python >=3.14
        - grpcio >=1.75.1,<2.0.0
        - pyarrow >=4.0.0
        # from the pandas extra
        - pandas >=1.3.0
        - pandas-gbq >=0.26.1
        - db-dtypes >=1.0.4,<2.0.0
        # from the ipywidgets extra
        - ipywidgets >=7.7.1
        - ipykernel >=6.2.0
        # from the geopandas extra
        - geopandas >=0.9.0,<2.0.0
        - shapely >=1.8.4,<3.0.0
        # from the ipython extra
        - ipython >=7.23.1
        - bigquery-magics >=0.6.0
        # from the matplotlib extra
        - matplotlib-base >=3.10.3
        # from the tqdm extra
        - tqdm >=4.23.4,<5.0.0
        # from the opentelemetry extra
        - opentelemetry-api >=1.1.0
        - opentelemetry-sdk >=1.1.0
        - opentelemetry-instrumentation >=0.20b0
        # from the bigquery_v2 extra
        - proto-plus >=1.26.1,<2.0.0
        - protobuf >=6.33.5,<8.0.0
    tests:
      - python:
          imports:
            - google.api_core
            - google.cloud.bigquery
            - google.cloud.bigquery.client
            - google.cloud.bigquery.dataset
            - google.cloud.bigquery.encryption_configuration
            - google.cloud.bigquery.enums
            - google.cloud.bigquery.external_config
            - google.cloud.bigquery.job
            - google.cloud.bigquery.magics
            - google.cloud.bigquery.model
            - google.cloud.bigquery.query
            - google.cloud.bigquery.retry
            - google.cloud.bigquery.routine
            - google.cloud.bigquery.schema
            - google.cloud.bigquery.table
            - google.cloud.bigquery_v2
            - google.cloud.bigquery_v2.types
          python_version:
            - ${{ python_min }}.*
            - "*"
          pip_check: true

  - package:
      name: ${{ name }}-core
    build:
      noarch: python
      script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python ${{ python_min }}.*
        - pip
        - setuptools
      run:
        - python >=${{ python_min }}
        - google-api-core-grpc >=2.28.0,<3.0.0
        # conda-forge package includes google-auth[pyopenssl] extra
        - google-auth >=2.14.1,<3.0.0
        - google-cloud-core >=2.4.1,<3.0.0
        - google-resumable-media >=2.0.0,<3.0.0
        - packaging >=24.2.0
        - python-dateutil >=2.8.2,<3.0.0
        - requests >=2.21.0,<3.0.0
    tests:
      - python:
          imports:
            - google.api_core
            - google.cloud.bigquery
            - google.cloud.bigquery.client
            - google.cloud.bigquery.dataset
            - google.cloud.bigquery.encryption_configuration
            - google.cloud.bigquery.enums
            - google.cloud.bigquery.external_config
            - google.cloud.bigquery.job
            - google.cloud.bigquery.model
            - google.cloud.bigquery.query
            - google.cloud.bigquery.retry
            - google.cloud.bigquery.routine
            - google.cloud.bigquery.schema
            - google.cloud.bigquery.table
          python_version:
            - ${{ python_min }}.*
            - "*"
          pip_check: true

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-bigquery
  license: Apache-2.0
  license_file: LICENSE
  summary: BigQuery API client library
  documentation: https://googleapis.dev/python/bigquery/latest/index.html
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-bigquery

extra:
  recipe-maintainers:
    - chalmerlowe
    - xylar
    - parthea
    - tswast
