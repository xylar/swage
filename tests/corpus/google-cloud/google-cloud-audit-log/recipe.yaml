schema_version: 1

context:
  name: google-cloud-audit-log
  version: 0.6.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/google_cloud_audit_log-${{ version }}.tar.gz
  sha256: 4aba72b45dc15344da1b2d8981320050fe39cfe80432f38e7318aa2e477c5bf2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - protobuf >=6.33.5,<8.0.0
    - googleapis-common-protos >=1.69.2,<2.0.0

tests:
  - python:
      imports:
        - google.cloud.audit.audit_log_pb2
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  summary: Google Cloud Audit Protos
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-audit-log
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-audit-log
  documentation: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-audit-log

extra:
  recipe-maintainers:
    - xylar
