schema_version: 1

context:
  name: google-cloud-build
  version: "3.38.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/google_cloud_build-${{ version }}.tar.gz
  sha256: 88ddc96293e70d4eb28bfe593a90291142fef3fc5e23c134c233df299b3e1397

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core-grpc >=2.25.0,<3.0.0
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    - grpc-google-iam-v1 >=0.14.2,<1.0.0
    # more restrictive constraint for python >=3.14
    - grpcio >=1.75.1,<2.0.0
    - proto-plus >=1.26.1,<2.0.0
    - protobuf >=6.33.5,<8.0.0

tests:
  - python:
      imports:
        - grpc
        - google.cloud.devtools.cloudbuild
        - google.cloud.devtools.cloudbuild_v1
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  summary: Google Cloud Build API client library
  license: Apache-2.0
  license_file: LICENSE
  description: "Google Cloud Build API is a Google Cloud service that lets client applications create and manage builds on Google Cloud Platform. Cloud Build lets you build software quickly across all languages. Get complete control over defining custom workflows for building, testing, and deploying across multiple environments::
    - such as VMs, serverless, Kubernetes, or Firebase.\nSee the [quick start guide](https://googleapis.dev/python/cloudbuild/latest/index.html#quick-start)."
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-build
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-build
  documentation: https://googleapis.dev/python/cloudbuild/latest/index.html

extra:
  recipe-maintainers:
    - xylar
    - parthea
