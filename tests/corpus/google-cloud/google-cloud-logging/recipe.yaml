schema_version: 1

context:
  name: google-cloud-logging
  version: "3.16.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: d65044004d3a2ae6eced1f0118f0c44dc551872ddb837ba815f75d159ca148c8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core >=2.25.0,<3.0.0
    - google-api-core-grpc
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    - google-cloud-appengine-logging >=1.6.1,<2.0.0
    - google-cloud-audit-log >=0.3.2,<1.0.0
    - google-cloud-core >=2.0.0,<3.0.0
    - grpc-google-iam-v1 >=0.14.2,<1.0.0
    - opentelemetry-api >=1.16.0
    # more restrictive constraint for python >=3.14
    - grpcio >=1.75.1,<2.0.0
    - proto-plus >=1.26.1,<2.0.0
    - protobuf >=6.33.5,<8.0.0

tests:
  - python:
      imports:
        - google.cloud.logging
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Stackdriver Logging API client library
  description: |
    The Stackdriver Logging API writes log entries and manages your Stackdriver Logging configuration.
    See the [usage guide](https://googleapis.dev/python/logging/latest/usage.html).

  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-logging
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-logging
  documentation: https://docs.cloud.google.com/logging/docs

extra:
  recipe-maintainers:
    - parthea
    - xylar
